name: Feature Request
description: Suggest an idea or new parser capability for LogMorph
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Thank you for helping shape LogMorph's roadmap.
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear description of the problem you are trying to solve.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution or feature you would like to see.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Examples, log formats (e.g. BungeeCord, Velocity, Fabric, Forge, Docker, Nginx), or references.
    validations:
      required: false
