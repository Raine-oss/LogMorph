name: Bug Report
description: File a bug or unexpected behavior in LogMorph
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thank you for taking the time to report an issue in LogMorph.
  - type: input
    id: version
    attributes:
      label: LogMorph Version
      description: What version of LogMorph are you running? (e.g. 0.1.0 or output of logmorph --version)
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      description: Where are you running LogMorph?
      options:
        - Linux CLI (x86_64)
        - Windows CLI (x86_64)
        - Paper/Spigot Plugin (Pterodactyl Panel)
        - Paper/Spigot Plugin (Dedicated Server / VPS)
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Problem Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: sample_log
    attributes:
      label: Sample Log Snippet
      description: If possible, paste a small snippet of the log file that triggered the issue.
      render: text
    validations:
      required: false
