name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  build-rust-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Linux CLI & Shared Library
        run: cargo build --release
      - name: Rename CLI Binary
        run: cp target/release/logmorph target/release/logmorph-linux-x86_64
      - name: Upload Linux CLI
        uses: actions/upload-artifact@v4
        with:
          name: logmorph-linux-x86_64
          path: target/release/logmorph-linux-x86_64
      - name: Upload Shared Library
        uses: actions/upload-artifact@v4
        with:
          name: liblogmorph-so
          path: target/release/liblogmorph.so

  build-rust-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Windows CLI
        run: cargo build --release
      - name: Rename Windows Binary
        run: copy target\release\logmorph.exe target\release\logmorph-windows-x86_64.exe
      - name: Upload Windows CLI
        uses: actions/upload-artifact@v4
        with:
          name: logmorph-windows-x86_64.exe
          path: target/release/logmorph-windows-x86_64.exe

  build-plugin:
    needs: build-rust-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          server-id: github
          server-username: ${{ github.actor }}
          server-password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: liblogmorph-so
          path: plugin/src/main/resources/natives/linux-x86_64/
      - name: Build Paper Plugin Jar
        working-directory: plugin
        run: mvn clean package
      - name: Publish to GitHub Packages
        working-directory: plugin
        run: mvn deploy -DskipTests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload Plugin Jar
        uses: actions/upload-artifact@v4
        with:
          name: LogMorph-1.0.0.jar
          path: plugin/target/LogMorph-1.0.0.jar

  publish-release:
    needs: [build-rust-linux, build-rust-windows, build-plugin]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Prepare Release Assets
        run: |
          mkdir -p release-assets
          cp artifacts/logmorph-linux-x86_64/logmorph-linux-x86_64 release-assets/logmorph-linux-x86_64
          cp artifacts/logmorph-linux-x86_64/logmorph-linux-x86_64 release-assets/logmorph
          cp artifacts/logmorph-windows-x86_64.exe/logmorph-windows-x86_64.exe release-assets/logmorph-windows-x86_64.exe
          cp artifacts/logmorph-windows-x86_64.exe/logmorph-windows-x86_64.exe release-assets/logmorph.exe
          cp artifacts/LogMorph-1.0.0.jar/LogMorph-1.0.0.jar release-assets/LogMorph-1.0.0.jar
          cp artifacts/LogMorph-1.0.0.jar/LogMorph-1.0.0.jar release-assets/LogMorph.jar
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
